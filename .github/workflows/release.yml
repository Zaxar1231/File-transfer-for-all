name: Release

# Builds the app for every platform and publishes a GitHub release.
#
# Releases are continuous: when a push to main carries a version in pyproject.toml
# that has no tag yet, the builds run and the release job creates tag v<version>
# itself. A tag pushed by hand (v*) publishes too. Pull requests that touch this
# file only build, to test it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLET_CLI: "flet[cli]==1.0.5"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
              exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "v$version is already released; nothing to do"
              echo "build=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "New version $version: building and releasing"
              echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: windows }
          # One build per CPU: a universal build cross-installs x86_64 wheels and fails on cryptography.
          - { name: macos-arm64, os: macos-latest, target: macos, extra: --arch arm64 }
          - { name: macos-x64, os: macos-15-intel, target: macos, extra: --arch x86_64 }
          # Ubuntu 22.04 keeps glibc old (2.35), so the build also runs on older distributions.
          - { name: linux-x64, os: ubuntu-22.04, target: linux }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: linux }
          - { name: android, os: ubuntu-24.04, target: apk }
          - { name: android-split, os: ubuntu-24.04, target: apk, extra: --split-per-abi }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        shell: bash
        run: echo "VERSION=${{ needs.plan.outputs.version }}" >> "$GITHUB_ENV"

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            binutils clang cmake lld llvm ninja-build pkg-config \
            libgtk-3-dev libasound2-dev libsecret-1-dev libunwind-dev libmpv-dev mpv \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: Newest Xcode
        if: matrix.target == 'macos'
        # Flutter plugins need the macOS 26 SDK; some runner images default to an older Xcode.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install Flet CLI
        run: pip install "${{ env.FLET_CLI }}"

      - name: Build
        shell: bash
        run: >
          flet build ${{ matrix.target }} ${{ matrix.extra }}
          --yes --no-rich-output
          --build-version "$VERSION" --build-number "${{ github.run_number }}"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.name }}" in
            windows-x64)
              (cd build/windows && 7z a -tzip "$GITHUB_WORKSPACE/dist/FileTransferForAll-windows-x64.zip" .) ;;
            macos-*)
              app=$(ls -d build/macos/*.app | head -1)
              ditto -c -k --keepParent "$app" "dist/FileTransferForAll-${{ matrix.name }}.zip" ;;
            linux-*)
              tar -C build/linux -czf "dist/FileTransferForAll-${{ matrix.name }}.tar.gz" . ;;
            android)
              cp "$(ls build/apk/*.apk | head -1)" dist/FileTransferForAll-android.apk ;;
            android-split)
              for abi in arm64-v8a armeabi-v7a x86_64; do
                cp "$(ls build/apk/*"$abi"*.apk | head -1)" "dist/FileTransferForAll-android-$abi.apk"
              done ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: File Transfer for All v${{ needs.plan.outputs.version }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
