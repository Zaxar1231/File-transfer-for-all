name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Samba and PuTTY tools for the SMB and SSH server tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends samba putty-tools rclone

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -v --durations=10
