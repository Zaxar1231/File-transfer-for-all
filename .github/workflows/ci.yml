name: CI

on:
  push:
    branches: [main]  # branches are tested through their pull requests, once
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the real tools the tests talk to (Samba, PuTTY, rclone, age)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends samba putty-tools rclone age

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -v --durations=10

  integration:
    # Real servers from docker-compose.yml: OpenSSH, vsftpd, Apache WebDAV, Samba, S3.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Start servers
        run: docker compose up -d --wait
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration tests
        run: FTA_IT=1 pytest -v tests/test_integration.py
      - name: Server logs
        if: failure()
        run: docker compose logs
      - name: Stop servers
        if: always()
        run: docker compose down

  audit:
    # Known vulnerabilities in the app's dependencies (PyPI advisory database).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install . pip-audit
      - name: Audit dependencies
        run: pip-audit --skip-editable --desc on
