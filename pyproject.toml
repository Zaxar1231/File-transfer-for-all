[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fta"
version = "0.1.0"
description = "Universal file transfer over pluggable protocols"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sftp = ["paramiko>=3.4"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
fta = "fta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
