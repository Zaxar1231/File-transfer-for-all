[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fta"
version = "0.1.0"
description = "Universal file transfer over pluggable protocols"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zaxar1231" }]
keywords = ["file-transfer", "ftp", "http", "sftp", "s3", "protocols"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Zaxar1231/File-transfer-for-all"
Issues = "https://github.com/Zaxar1231/File-transfer-for-all/issues"

[project.optional-dependencies]
sftp = ["paramiko>=3.4"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
fta = "fta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
