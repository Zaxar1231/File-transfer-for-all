[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fta"
version = "1.0.0"
description = "File Transfer for All: a Material You app for moving files over SFTP, FTP, WebDAV, S3 and HTTP"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zaxar1231" }]
keywords = ["file-transfer", "ftp", "sftp", "webdav", "s3", "material-you", "flet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
]
requires-python = ">=3.10"
# `flet build` installs exactly these into the packaged app.
dependencies = [
    "flet>=1.0.5,<1.1",
    "paramiko>=3.4",
    "boto3>=1.34",
    "smbprotocol>=1.13",
    "asyncssh>=2.14",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "cryptography>=42",  # self-signed certificate for direct LAN transfers
    "zeroconf>=0.132",   # finding nearby devices (mDNS/Bonjour)
    "segno>=1.6",        # QR codes, no image library needed
    "pyte>=0.8",         # VT100/xterm screen for the built-in SSH terminal
    "PySocks>=1.7",      # SOCKS proxies: Tor and .onion servers
]

[project.urls]
Homepage = "https://github.com/Zaxar1231/File-transfer-for-all"
Issues = "https://github.com/Zaxar1231/File-transfer-for-all/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",  # a hung network test fails with its stack instead of blocking CI
    "hypothesis>=6.100",    # fuzzing of parsers and network input
    # in-process servers for the protocol tests
    "pyftpdlib>=1.5.9",
    "wsgidav>=4.3",
    "cheroot>=10",
    "moto[s3]>=5.0",
]

[project.gui-scripts]
fta-app = "fta.app.main:run"

[project.scripts]
fta = "fta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 120
timeout_method = "thread"

# --- flet build (Windows, macOS, Linux, Android, iOS) ---------------------------

[tool.flet]
org = "io.github.zaxar1231"
product = "File Transfer for All"
artifact = "FileTransferForAll"
company = "Zaxar1231"
copyright = "Copyright (C) 2026 Zaxar1231"

[tool.flet.app]
path = "src"
module = "main"
